# Vhost datgio.vn trên nginx HOST (dùng chung với 365home.vn — cùng kiểu với /etc/nginx/sites-available/365home.vn).
# Cài: sudo cp deploy/nginx-datgio.conf /etc/nginx/sites-available/datgio.vn
#      sudo ln -s /etc/nginx/sites-available/datgio.vn /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
# Cert: Cloudflare Origin Certificate (Cloudflare → SSL/TLS → Origin Server → Create certificate, 15 năm,
# không cần gia hạn), zone datgio.vn để SSL mode "Full (strict)".
server {
    server_name datgio.vn www.datgio.vn;

    # Node WS realtime (pm2 datgio-ws, WS_PORT=3002 — 3001 là của 365home)
    location /ws/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 100M;
    }

    # Reverb (container reverb, host port 6002 — 6001 là của 365home). Client: VITE_REVERB_PATH=/reverb
    location /reverb/ {
        proxy_pass http://127.0.0.1:6002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    listen 443 ssl;
    ssl_certificate /etc/ssl/cloudflare/datgio.vn.pem;
    ssl_certificate_key /etc/ssl/cloudflare/datgio.vn.key;
}

server {
    listen 80;
    server_name datgio.vn www.datgio.vn;
    return 301 https://$host$request_uri;
}
