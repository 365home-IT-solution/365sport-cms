# Nginx trên HOST (không phải trong container) cho datgio.vn.
# Cài: sudo cp deploy/nginx-datgio.conf /etc/nginx/sites-available/datgio.vn
#      sudo ln -s /etc/nginx/sites-available/datgio.vn /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
# Chỉ listen 443 — port 80 public thuộc container 365home, nginx host mà listen 80 sẽ không khởi động
# được (xoá /etc/nginx/sites-enabled/default). Cloudflare zone datgio.vn để SSL mode "Full (strict)",
# cert là Cloudflare Origin Certificate (Cloudflare → SSL/TLS → Origin Server → Create certificate).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name datgio.vn www.datgio.vn;

    ssl_certificate     /etc/ssl/cloudflare/datgio.vn.pem;
    ssl_certificate_key /etc/ssl/cloudflare/datgio.vn.key;

    client_max_body_size 100M;

    # IP thật của khách (Cloudflare gửi CF-Connecting-IP) — Laravel đọc X-Forwarded-For/X-Real-IP.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    # Reverb (Laravel Echo) — plain nội bộ, nginx cầm TLS/WSS. 6002 = port host của container reverb.
    location /app/ {
        proxy_pass http://127.0.0.1:6002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /apps/ {
        proxy_pass http://127.0.0.1:6002;
        proxy_set_header Host $host;
    }

    # Còn lại (kể cả /ws/ — nginx trong container tự proxy sang Node WS port 3002) vào container app.
    location / {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
